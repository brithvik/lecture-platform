# Local development without Kubernetes. Same services as the cluster.
x-app-env: &app-env
  DATABASE_URL: postgresql://lecture:lecture@postgres:5432/lecture
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://seaweedfs:8333
  S3_BUCKET: lectures

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: lecture
      POSTGRES_PASSWORD: lecture
      POSTGRES_DB: lecture
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lecture"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-master.volumeSizeLimitMB=1024"]
    volumes:
      - objectdata:/data

  api:
    build: .
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment: *app-env
    ports:
      - "8000:8000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      seaweedfs: { condition: service_started }

  worker:
    build: .
    command: ["python", "worker.py"]
    environment:
      <<: *app-env
      MODEL_SIZE: base
      CPU_THREADS: "4"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      seaweedfs: { condition: service_started }

volumes:
  pgdata:
  objectdata:
