# Settings shared by the app. The Secret holds passwords; the ConfigMap holds everything else.
# (A plain Secret is fine for local development; we'll encrypt secrets properly before the cloud.)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: lecture
  POSTGRES_PASSWORD: dev-only-password
  POSTGRES_DB: lecture
  DATABASE_URL: postgresql://lecture:dev-only-password@postgres:5432/lecture
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  REDIS_URL: redis://redis:6379/0
  DATA_DIR: /data