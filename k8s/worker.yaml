# The worker: transcribes queued lectures in the background.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app: worker }
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: worker
          image: lecture-platform:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          env:
            - { name: MODEL_SIZE, value: "base" }
            - { name: CPU_THREADS, value: "4" }
          volumeMounts:
            - { name: appdata, mountPath: /data }
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits: { memory: 3Gi }   # stop one runaway job from eating all memory
      volumes:
        - name: appdata
          persistentVolumeClaim: { claimName: appdata }
