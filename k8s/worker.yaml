# The worker: splits lectures into chunks and transcribes chunks in parallel.
# No replica count here: KEDA (keda.yaml) decides how many workers run, from 0 up to 4.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels: { app: worker }
spec:
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      terminationGracePeriodSeconds: 60   # time to hand back the current job before being stopped
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: worker
          image: lecture-platform:v4
          imagePullPolicy: IfNotPresent
          command: ["python", "worker.py"]
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: storage-credentials }
          env:
            - { name: MODEL_SIZE, value: "base" }
            - { name: CPU_THREADS, value: "2" }      # several small workers share the laptop's cores
            - { name: CHUNK_SECONDS, value: "30" }   # short chunks for testing; ~120 is better for real use
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: DATABASE_URL } }
          resources:
            requests: { cpu: 500m, memory: 768Mi }
            limits: { memory: 2Gi }
